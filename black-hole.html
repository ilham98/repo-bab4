<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kerr Black Hole — Three.js</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
  canvas { display: block; }
  #hud { position: fixed; left: 14px; bottom: 12px; color: #6a7a8a; font-size: 12px;
    line-height: 1.5; pointer-events: none; text-shadow: 0 0 6px #000; user-select: none; }
  #hud b { color: #cdd9e5; font-weight: 600; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #d66;
    font-size: 14px; text-align: center; padding: 40px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="hud">
  <b>Kerr black hole</b> (spin a/M = 0.84) — Three.js · real-time geodesic ray tracing<br />
  Hamiltonian integration of the Kerr metric · frame-dragging · grav + Doppler shift · bloom<br />
  <b>Drag</b> to orbit · <b>scroll</b> to zoom · <b>right-drag</b> to pan
</div>
<div id="err"></div>
<!-- Three.js + addons + app, bundled to one classic script so the page works
     even when opened directly from disk (file://). Rebuild with:
       npm run build   (see package.json / README) -->
<script src="./black-hole.bundle.js"></script>
</body>
</html>
