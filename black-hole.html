<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Black Hole — Geodesic Ray-Tracer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 14px; bottom: 12px; color: #6a7a8a; font-size: 12px;
    line-height: 1.5; pointer-events: none; text-shadow: 0 0 6px #000; user-select: none; }
  #hud b { color: #cdd9e5; font-weight: 600; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #d66;
    font-size: 14px; text-align: center; padding: 40px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <b>Schwarzschild black hole</b> — real-time null-geodesic ray tracing<br />
  Each pixel's light ray is integrated through curved spacetime (RK4), so the disk lenses over the top<br />
  Drag to orbit · scroll to zoom
</div>
<div id="err"></div>

<!-- ====================== VERTEX SHADER ====================== -->
<script id="vs" type="x-shader/x-vertex">#version 300 es
precision highp float;
const vec2 verts[3] = vec2[3](vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));
void main(){ gl_Position = vec4(verts[gl_VertexID], 0.0, 1.0); }
</script>

<!-- ===================== FRAGMENT SHADER ===================== -->
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec2  uRes;
uniform float uTime;
uniform vec3  uCamPos;
uniform vec3  uCamRight;
uniform vec3  uCamUp;
uniform vec3  uCamFwd;
uniform float uTanHalfFov;

/*
 * Units: the Schwarzschild radius r_s = 1, so the event horizon is the unit
 * sphere and M = 0.5. A photon's path obeys the null-geodesic equation, which
 * in Cartesian form reduces to the central acceleration
 *
 *     d^2x/dλ^2 = -3/2 · |L|^2 · x / r^5 ,     L = x × v
 *
 * This single term carries ALL the light bending (there is no Newtonian piece
 * for light); in the weak field it reproduces the deflection 2 r_s / b. We
 * integrate it backwards from the camera with RK4.
 */

#define RS        1.0
#define HORIZON   1.0
#define DISK_IN   2.4      // inner edge ~ innermost stable orbit region
#define DISK_OUT  9.0
#define ESCAPE    32.0
#define MAX_STEPS 300

// ---------- hashing / noise ----------
float hash31(vec3 p){
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
float vnoise(vec3 p){
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash31(i+vec3(0,0,0)), hash31(i+vec3(1,0,0)), f.x),
                 mix(hash31(i+vec3(0,1,0)), hash31(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(hash31(i+vec3(0,0,1)), hash31(i+vec3(1,0,1)), f.x),
                 mix(hash31(i+vec3(0,1,1)), hash31(i+vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p){
  float a = 0.5, s = 0.0;
  for(int i=0;i<5;i++){ s += a*vnoise(p); p *= 2.02; a *= 0.5; }
  return s;
}

// ---------- procedural starfield (the lensed background) ----------
vec3 starField(vec3 dir){
  vec3 col = vec3(0.0);
  for(int k=0;k<3;k++){
    float sc = 70.0 + float(k)*110.0;
    vec3 p  = dir * sc;
    vec3 id = floor(p);
    vec3 fr = fract(p) - 0.5;
    float h = hash31(id + float(k)*11.7);
    if(h > 0.94){
      vec3 jit = vec3(hash31(id+1.3), hash31(id+2.7), hash31(id+4.1)) - 0.5;
      float d  = length(fr - jit*0.7);
      float br = smoothstep(0.16, 0.0, d) * (h - 0.94) / 0.06;
      float t  = hash31(id + 9.1);
      vec3 sc2 = mix(vec3(0.65,0.78,1.0), vec3(1.0,0.86,0.62), t);
      col += sc2 * br;
    }
  }
  // faint nebula + a soft galactic band so the lensing has structure to warp
  float n = fbm(dir*3.0 + 11.0);
  vec3 neb = mix(vec3(0.015,0.01,0.035), vec3(0.05,0.02,0.06), n) * n * 0.5;
  float band = exp(-pow(dir.y*2.6, 2.0));
  neb += vec3(0.03,0.045,0.08) * band * 0.35 * (0.4 + 0.6*fbm(dir*5.0));
  return col + neb;
}

// ---------- accretion disk emission at a plane-crossing point ----------
vec3 diskEmission(vec3 cp, vec3 vel){
  float cr  = length(cp.xz);
  float rad = clamp((cr - DISK_IN) / (DISK_OUT - DISK_IN), 0.0, 1.0);
  float ang = atan(cp.z, cp.x);

  // turbulent spiralling plasma, rotating in time (faster near the centre)
  float orbit = uTime * (0.9 / pow(cr, 1.5));
  vec3 q = vec3(cos(ang+orbit), sin(ang+orbit), 0.0) * cr;
  float turb = fbm(vec3(ang*2.0 - orbit*3.0, cr*0.9, 0.0)) * 0.6
             + fbm(q*1.3 + 5.0) * 0.6;
  float density = smoothstep(0.35, 1.0, turb) * (0.6 + 0.7*(1.0-rad));

  // temperature: hot blue-white inner -> orange outer (T ~ r^-3/4)
  float temp = pow(1.0 - rad, 0.75);
  vec3 hot  = vec3(0.7, 0.85, 1.0);
  vec3 warm = vec3(1.0, 0.55, 0.18);
  vec3 base = mix(warm, hot, temp);
  base += vec3(0.25,0.12,0.0) * (1.0-temp);   // extra glow in the cool outer

  // relativistic Doppler beaming: brighten the side rotating toward us
  vec3  vorb = normalize(cross(vec3(0.0,1.0,0.0), cp)); // orbital direction
  float beta = clamp(sqrt(0.5 / max(cr, 1.2)), 0.0, 0.85); // Keplerian speed
  float gamma = 1.0 / sqrt(1.0 - beta*beta);
  vec3  toObs = normalize(-vel);                 // photon heads to camera
  float mu = dot(vorb, toObs);
  float doppler = 1.0 / (gamma * (1.0 - beta*mu));
  float beam = pow(doppler, 3.0);

  float brightness = density * (0.5 + 1.1*(1.0-rad)) * beam;
  return base * brightness * 0.6;
}

vec3 accel(vec3 pos, vec3 vel){
  vec3 L = cross(pos, vel);
  float h2 = dot(L, L);
  float r  = length(pos);
  return -1.5 * h2 * pos / pow(r, 5.0);
}

void main(){
  vec2 uv = (gl_FragCoord.xy*2.0 - uRes) / uRes.y;
  vec3 rd = normalize(uCamFwd
          + uCamRight * uv.x * uTanHalfFov
          + uCamUp    * uv.y * uTanHalfFov);

  vec3 pos = uCamPos;
  vec3 vel = rd;

  vec3  diskCol = vec3(0.0);
  float diskA   = 0.0;
  bool  captured = false;

  for(int i=0;i<MAX_STEPS;i++){
    float r = length(pos);
    if(r < HORIZON){ captured = true; break; }
    if(r > ESCAPE && dot(pos, vel) > 0.0) break;

    float dt = 0.12 + 0.05 * r;          // bigger steps far from the hole

    // ---- RK4 on (pos, vel) ----
    vec3 a1 = accel(pos, vel);
    vec3 a2 = accel(pos + 0.5*dt*vel,            vel + 0.5*dt*a1);
    vec3 a3 = accel(pos + 0.5*dt*(vel+0.5*dt*a1), vel + 0.5*dt*a2);
    vec3 a4 = accel(pos + dt*(vel+dt*a2),         vel + dt*a3);
    vec3 nPos = pos + dt*(vel + dt/6.0*(a1+a2+a3));
    vec3 nVel = vel + dt/6.0*(a1 + 2.0*a2 + 2.0*a3 + a4);

    // ---- accretion-disk plane crossing (y = 0) ----
    if(nPos.y * pos.y < 0.0 && diskA < 0.99){
      float t  = pos.y / (pos.y - nPos.y);
      vec3  cp = mix(pos, nPos, t);
      float cr = length(cp.xz);
      if(cr > DISK_IN && cr < DISK_OUT){
        vec3 em = diskEmission(cp, mix(vel, nVel, t));
        float a = clamp(length(em)*0.6, 0.0, 1.0) * 0.85;
        diskCol += (1.0 - diskA) * em;
        diskA    = diskA + (1.0 - diskA) * a;
      }
    }

    pos = nPos; vel = nVel;
  }

  vec3 bg  = captured ? vec3(0.0) : starField(normalize(vel));
  vec3 col = diskCol + (1.0 - diskA) * bg;

  // ACES-ish tonemap + gamma
  col *= 0.85;
  col = (col*(2.51*col+0.03)) / (col*(2.43*col+0.59)+0.14);
  col = pow(clamp(col, 0.0, 1.0), vec3(0.4545));
  fragColor = vec4(col, 1.0);
}
</script>

<script>
"use strict";
const canvas = document.getElementById("c");
const errEl  = document.getElementById("err");
const gl = canvas.getContext("webgl2", { antialias: false, preserveDrawingBuffer: true });

function fail(msg){ errEl.style.display = "grid"; errEl.textContent = msg; throw new Error(msg); }
if(!gl) fail("WebGL2 is required to render this black hole. Try a recent Chrome/Firefox/Safari.");

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src.trim());
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail("Shader error:\n" + gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER,   document.getElementById("vs").textContent));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById("fs").textContent));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) fail("Link error:\n" + gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const U = {};
for(const n of ["uRes","uTime","uCamPos","uCamRight","uCamUp","uCamFwd","uTanHalfFov"])
  U[n] = gl.getUniformLocation(prog, n);

const vao = gl.createVertexArray();   // empty VAO; positions come from the shader
gl.bindVertexArray(vao);

// ---- vec3 helpers ----
const sub  = (a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const norm = (a)=>{ const l=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/l,a[1]/l,a[2]/l]; };
const cross= (a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];

// ---- camera / interaction ----
let yaw = 0.5, pitch = 0.16, dist = 15.0, autoSpin = true;
let dragging = false, lastX = 0, lastY = 0;

canvas.addEventListener("mousedown", e=>{ dragging=true; autoSpin=false; lastX=e.clientX; lastY=e.clientY; });
window.addEventListener("mouseup",   ()=> dragging=false);
window.addEventListener("mousemove", e=>{
  if(!dragging) return;
  yaw   += (e.clientX-lastX)*0.006;
  pitch += (e.clientY-lastY)*0.006;
  pitch  = Math.max(-1.35, Math.min(1.35, pitch));
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener("wheel", e=>{
  dist = Math.max(7.0, Math.min(40.0, dist + Math.sign(e.deltaY)*0.8));
  e.preventDefault();
}, { passive:false });

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const w = Math.floor(window.innerWidth  * dpr);
  const h = Math.floor(window.innerHeight * dpr);
  if(canvas.width !== w || canvas.height !== h){
    canvas.width = w; canvas.height = h;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
  }
  gl.viewport(0,0,canvas.width,canvas.height);
}
window.addEventListener("resize", resize);

function frame(ms){
  const t = ms * 0.001;
  if(autoSpin) yaw = 0.4 + t*0.06;
  resize();

  const cp = pitch, cy = yaw;
  const camPos = [
    Math.cos(cp)*Math.cos(cy)*dist,
    Math.sin(cp)*dist,
    Math.cos(cp)*Math.sin(cy)*dist,
  ];
  const fwd   = norm(sub([0,0,0], camPos));
  const right = norm(cross(fwd, [0,1,0]));
  const up    = cross(right, fwd);

  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, t);
  gl.uniform3fv(U.uCamPos,   camPos);
  gl.uniform3fv(U.uCamRight, right);
  gl.uniform3fv(U.uCamUp,    up);
  gl.uniform3fv(U.uCamFwd,   fwd);
  gl.uniform1f(U.uTanHalfFov, Math.tan(0.5 * 50.0 * Math.PI/180.0));

  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
