<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kerr Black Hole — Geodesic Ray-Tracer</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 14px; bottom: 12px; color: #6a7a8a; font-size: 12px;
    line-height: 1.5; pointer-events: none; text-shadow: 0 0 6px #000; user-select: none; }
  #hud b { color: #cdd9e5; font-weight: 600; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #d66;
    font-size: 14px; text-align: center; padding: 40px; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <b>Kerr black hole</b> (spin a/M = 0.84) — real-time geodesic ray tracing in curved spacetime<br />
  Hamiltonian integration of the Kerr metric · frame-dragging warps the shadow · grav + Doppler shift · HDR bloom<br />
  Drag to orbit · scroll to zoom
</div>
<div id="err"></div>

<!-- ====================== VERTEX SHADER (shared) ====================== -->
<script id="vs" type="x-shader/x-vertex">#version 300 es
precision highp float;
const vec2 verts[3] = vec2[3](vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));
void main(){ gl_Position = vec4(verts[gl_VertexID], 0.0, 1.0); }
</script>

<!-- ===================== SCENE FRAGMENT SHADER (Kerr) ===================== -->
<script id="fsScene" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec2  uRes;
uniform float uTime;
uniform vec3  uCamPos;
uniform vec3  uCamRight;
uniform vec3  uCamUp;
uniform vec3  uCamFwd;
uniform float uTanHalfFov;

/*
 * Rotating (Kerr) black hole, geometrized units with M = 0.5 so the
 * Schwarzschild radius r_s = 2M = 1. Spin a = 0.42 (a/M = 0.84). The spin
 * axis is world +Y; the accretion disk lies in the equatorial plane y = 0.
 *
 * Photons follow null geodesics of the Kerr metric. We integrate them with a
 * HAMILTONIAN formulation in Boyer-Lindquist coordinates (r, theta, phi):
 *
 *     H = 1/2 g^{mu nu} p_mu p_nu = 0   (null)
 *
 * The energy E = -p_t and axial angular momentum L = p_phi are conserved
 * (t and phi are cyclic), so we evolve only (r, theta, phi, p_r, p_theta) by
 * Hamilton's equations, taking dH/dr and dH/dtheta by finite differences of
 * the inverse metric. Frame-dragging emerges automatically from g^{t phi}.
 */
#define MASS   0.5
#define A_SPIN 0.42
#define DISK_IN  1.9
#define DISK_OUT 9.0
#define ESCAPE   30.0
#define MAX_STEPS 240

float hash31(vec3 p){
  p = fract(p * 0.3183099 + 0.1); p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
float vnoise(vec3 p){
  vec3 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash31(i+vec3(0,0,0)),hash31(i+vec3(1,0,0)),f.x),
                 mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),f.x),
                 mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),f.x),f.y),f.z);
}
float fbm(vec3 p){ float a=0.5,s=0.0; for(int i=0;i<5;i++){ s+=a*vnoise(p); p*=2.02; a*=0.5; } return s; }

vec3 starField(vec3 dir){
  vec3 col = vec3(0.0);
  for(int k=0;k<3;k++){
    float sc = 70.0 + float(k)*110.0;
    vec3 p = dir*sc, id = floor(p), fr = fract(p)-0.5;
    float h = hash31(id + float(k)*11.7);
    if(h > 0.94){
      vec3 jit = vec3(hash31(id+1.3),hash31(id+2.7),hash31(id+4.1)) - 0.5;
      float d = length(fr - jit*0.7);
      float br = smoothstep(0.16,0.0,d) * (h-0.94)/0.06;
      vec3 sc2 = mix(vec3(0.65,0.78,1.0), vec3(1.0,0.86,0.62), hash31(id+9.1));
      col += sc2 * br * 1.4;
    }
  }
  float n = fbm(dir*3.0 + 11.0);
  vec3 neb = mix(vec3(0.015,0.01,0.035), vec3(0.05,0.02,0.06), n) * n * 0.5;
  float band = exp(-pow(dir.y*2.6, 2.0));
  neb += vec3(0.03,0.045,0.08) * band * 0.35 * (0.4 + 0.6*fbm(dir*5.0));
  return col + neb;
}

// --- Kerr inverse metric (Boyer-Lindquist), spin axis = Y ------------------
void metric(float r, float th, out float gtt, out float gtp, out float gpp,
            out float grr, out float gthth){
  float s2 = max(sin(th)*sin(th), 1e-4);
  float c2 = 1.0 - s2;
  float a  = A_SPIN;
  float Sig = r*r + a*a*c2;
  float Del = r*r - 2.0*MASS*r + a*a;
  float r2a2 = r*r + a*a;
  gtt   = -((r2a2*r2a2 - a*a*Del*s2) / (Sig*Del));
  gtp   = -(2.0*MASS*r*a) / (Sig*Del);
  gpp   = (Del - a*a*s2) / (Sig*Del*s2);
  grr   = Del / Sig;
  gthth = 1.0 / Sig;
}

float hamiltonian(float r, float th, float pr, float pth, float pt, float L){
  float gtt,gtp,gpp,grr,gthth;
  metric(r, th, gtt,gtp,gpp,grr,gthth);
  return 0.5*(gtt*pt*pt + 2.0*gtp*pt*L + gpp*L*L + grr*pr*pr + gthth*pth*pth);
}

// Hamilton's equations: returns time-derivatives of (r,theta,phi,p_r,p_theta)
void geoDeriv(float r,float th,float ph,float pr,float pth,float pt,float L,
              out float dr,out float dth,out float dph,out float dpr,out float dpth){
  float gtt,gtp,gpp,grr,gthth;
  metric(r, th, gtt,gtp,gpp,grr,gthth);
  dr  = grr*pr;
  dth = gthth*pth;
  dph = gtp*pt + gpp*L;
  float e = 1e-3;
  dpr  = -(hamiltonian(r+e,th,pr,pth,pt,L) - hamiltonian(r-e,th,pr,pth,pt,L)) / (2.0*e);
  dpth = -(hamiltonian(r,th+e,pr,pth,pt,L) - hamiltonian(r,th-e,pr,pth,pt,L)) / (2.0*e);
}

void deriv(float y[5], float pt, float L, out float d[5]){
  geoDeriv(y[0],y[1],y[2],y[3],y[4], pt, L, d[0],d[1],d[2],d[3],d[4]);
}

// accretion-disk emission at BL radius cr / azimuth ph, given photon direction
vec3 diskEmission(float cr, float ph, vec3 pdir){
  float rad = clamp((cr - DISK_IN) / (DISK_OUT - DISK_IN), 0.0, 1.0);
  float orbit = uTime * (0.9 / pow(cr, 1.5));
  vec3  q = vec3(cos(ph+orbit), sin(ph+orbit), 0.0) * cr;
  float turb = fbm(vec3(ph*2.0 - orbit*3.0, cr*0.9, 0.0))*0.6 + fbm(q*1.3 + 5.0)*0.6;
  float density = smoothstep(0.35, 1.0, turb) * (0.6 + 0.7*(1.0-rad));

  float temp = pow(1.0 - rad, 0.75);
  vec3  base = mix(vec3(1.0,0.55,0.18), vec3(0.75,0.86,1.0), temp);

  // prograde orbital direction (with the spin) -> phi-hat in the equator
  float sp = sin(ph), cp = cos(ph);
  vec3  vorb  = vec3(-sp, 0.0, cp);
  float beta  = clamp(sqrt(0.5 / max(cr,1.2)), 0.0, 0.88);
  float gamma = 1.0 / sqrt(1.0 - beta*beta);
  vec3  toObs = -pdir;
  float doppler = 1.0 / (gamma * (1.0 - beta*dot(vorb,toObs)));
  float grav    = sqrt(max(1e-4, 1.0 - 1.0/cr));        // gravitational redshift
  float g = doppler * grav;

  float boost = clamp(pow(g, 4.0), 0.0, 7.0);
  vec3  shift = mix(vec3(1.0,0.42,0.20), vec3(0.7,0.82,1.25), clamp((g-0.55)/0.9, 0.0, 1.0));
  float brightness = density * (0.5 + 1.1*(1.0-rad)) * boost;
  return base * shift * brightness * 0.32;
}

// Cartesian unit-vector basis of BL coords at (th, ph), spin axis = Y
void blBasis(float th, float ph, out vec3 er, out vec3 et, out vec3 ep){
  float st=sin(th), ct=cos(th), sp=sin(ph), cp=cos(ph);
  er = vec3(st*cp, ct, st*sp);
  et = vec3(ct*cp, -st, ct*sp);
  ep = vec3(-sp, 0.0, cp);
}

void main(){
  vec2 uv = (gl_FragCoord.xy*2.0 - uRes) / uRes.y;
  vec3 rd = normalize(uCamFwd + uCamRight*uv.x*uTanHalfFov + uCamUp*uv.y*uTanHalfFov);

  // --- camera Cartesian -> Boyer-Lindquist (oblate spheroidal), axis = Y ---
  vec3  P = uCamPos;
  float a = A_SPIN;
  float rho2 = dot(P,P);
  float r2 = 0.5*((rho2 - a*a) + sqrt((rho2 - a*a)*(rho2 - a*a) + 4.0*a*a*P.y*P.y));
  float r0  = sqrt(r2);
  float th0 = acos(clamp(P.y / r0, -1.0, 1.0));
  float ph0 = atan(P.z, P.x);

  vec3 er, et, ep; blBasis(th0, ph0, er, et, ep);
  float pr0  = dot(rd, er);                 // flat-space momenta (camera is far)
  float pth0 = r0 * dot(rd, et);
  float pphi = r0 * sin(th0) * dot(rd, ep);
  float pt   = -1.0;                          // E = 1 (affine scale)
  float L    = pphi;

  float y[5];
  y[0]=r0; y[1]=th0; y[2]=ph0; y[3]=pr0; y[4]=pth0;

  float rplus = MASS + sqrt(max(0.0, MASS*MASS - a*a));   // outer horizon
  vec3  diskCol = vec3(0.0); float diskA = 0.0;
  bool  captured = false;
  float prevCos = cos(y[1]);

  for(int i=0;i<MAX_STEPS;i++){
    float r   = y[0];
    float Del = r*r - 2.0*MASS*r + a*a;
    if(r < rplus*1.04 || Del < 0.03){ captured = true; break; }
    if(r > ESCAPE) break;

    float h = 0.14 * (1.0 + 0.12*r);

    float k1[5],k2[5],k3[5],k4[5],tmp[5],yn[5];
    deriv(y, pt, L, k1);
    for(int j=0;j<5;j++) tmp[j] = y[j] + 0.5*h*k1[j];
    deriv(tmp, pt, L, k2);
    for(int j=0;j<5;j++) tmp[j] = y[j] + 0.5*h*k2[j];
    deriv(tmp, pt, L, k3);
    for(int j=0;j<5;j++) tmp[j] = y[j] + h*k3[j];
    deriv(tmp, pt, L, k4);
    for(int j=0;j<5;j++) yn[j] = y[j] + h/6.0*(k1[j]+2.0*k2[j]+2.0*k3[j]+k4[j]);
    yn[1] = clamp(yn[1], 0.02, 3.12139);

    // equatorial-plane (disk) crossing
    float newCos = cos(yn[1]);
    if(prevCos*newCos < 0.0 && diskA < 0.99){
      float t  = prevCos / (prevCos - newCos);
      float rc = mix(y[0], yn[0], t);
      if(rc > DISK_IN && rc < DISK_OUT){
        float phc = mix(y[2], yn[2], t);
        float ic0=mix(y[0],yn[0],t), ic1=mix(y[1],yn[1],t),
              ic3=mix(y[3],yn[3],t), ic4=mix(y[4],yn[4],t);
        float d0,d1,d2,d3,d4;
        geoDeriv(ic0,ic1,phc,ic3,ic4,pt,L,d0,d1,d2,d3,d4);
        vec3 er2,et2,ep2; blBasis(ic1, phc, er2, et2, ep2);
        vec3 pdir = normalize(d0*er2 + ic0*d1*et2 + ic0*sin(ic1)*d2*ep2);
        vec3 em = diskEmission(rc, phc, pdir);
        float al = clamp(length(em)*0.6, 0.0, 1.0) * 0.85;
        diskCol += (1.0 - diskA) * em;
        diskA    = diskA + (1.0 - diskA) * al;
      }
    }
    prevCos = newCos;
    for(int j=0;j<5;j++) y[j] = yn[j];
  }

  vec3 bg = vec3(0.0);
  if(!captured){
    float d0,d1,d2,d3,d4;
    geoDeriv(y[0],y[1],y[2],y[3],y[4],pt,L,d0,d1,d2,d3,d4);
    vec3 er3,et3,ep3; blBasis(y[1], y[2], er3, et3, ep3);
    vec3 dir = normalize(d0*er3 + y[0]*d1*et3 + y[0]*sin(y[1])*d2*ep3);
    bg = starField(dir);
  }
  fragColor = vec4(diskCol + (1.0 - diskA) * bg, 1.0);   // linear HDR
}
</script>

<!-- =============== BLUR / BRIGHT-PASS FRAGMENT SHADER =============== -->
<script id="fsBlur" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 o;
uniform sampler2D uTex;
uniform vec2  uResOut;
uniform vec2  uTexelIn;
uniform vec2  uDir;
uniform float uThresh;
void main(){
  vec2 uv = gl_FragCoord.xy / uResOut;
  float w[5] = float[5](0.227027, 0.194594, 0.121622, 0.054054, 0.016216);
  vec3 acc = max(texture(uTex, uv).rgb - uThresh, 0.0) * w[0];
  for(int i=1;i<5;i++){
    vec2 off = uDir * uTexelIn * float(i) * 1.5;
    acc += max(texture(uTex, uv + off).rgb - uThresh, 0.0) * w[i];
    acc += max(texture(uTex, uv - off).rgb - uThresh, 0.0) * w[i];
  }
  o = vec4(acc, 1.0);
}
</script>

<!-- ================= COMPOSITE / TONEMAP FRAGMENT SHADER ================= -->
<script id="fsComp" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 o;
uniform sampler2D uScene;
uniform sampler2D uBloom;
uniform vec2 uResOut;
void main(){
  vec2 uv = gl_FragCoord.xy / uResOut;
  vec3 c = texture(uScene, uv).rgb + texture(uBloom, uv).rgb * 0.9;
  c *= 1.25;                                       // exposure
  c = (c*(2.51*c+0.03)) / (c*(2.43*c+0.59)+0.14);  // ACES filmic
  vec2 d = uv - 0.5;
  c *= 1.0 - 0.35*dot(d,d);                         // vignette
  o = vec4(pow(clamp(c,0.0,1.0), vec3(0.4545)), 1.0);
}
</script>

<script>
"use strict";
const canvas = document.getElementById("c");
const errEl  = document.getElementById("err");
const gl = canvas.getContext("webgl2", { antialias:false });
function fail(m){ errEl.style.display="grid"; errEl.textContent=m; throw new Error(m); }
if(!gl) fail("WebGL2 is required to render this black hole. Try a recent Chrome/Firefox/Safari.");
if(!gl.getExtension("EXT_color_buffer_float")) fail("EXT_color_buffer_float unavailable — needed for HDR bloom.");

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src.trim()); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail("Shader:\n"+gl.getShaderInfoLog(s));
  return s;
}
function program(fsId){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER,   document.getElementById("vs").textContent));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, document.getElementById(fsId).textContent));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) fail("Link:\n"+gl.getProgramInfoLog(p));
  return p;
}
const progScene = program("fsScene");
const progBlur  = program("fsBlur");
const progComp  = program("fsComp");
const loc = (p,names)=>{ const o={}; for(const n of names) o[n]=gl.getUniformLocation(p,n); return o; };
const Us = loc(progScene, ["uRes","uTime","uCamPos","uCamRight","uCamUp","uCamFwd","uTanHalfFov"]);
const Ub = loc(progBlur,  ["uTex","uResOut","uTexelIn","uDir","uThresh"]);
const Uc = loc(progComp,  ["uScene","uBloom","uResOut"]);

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

function makeTarget(w,h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fbo, w, h };
}
let scene, bloomA, bloomB, curW=0, curH=0;
function allocTargets(w,h){
  scene  = makeTarget(w, h);
  const bw = Math.max(1, w>>1), bh = Math.max(1, h>>1);
  bloomA = makeTarget(bw, bh);
  bloomB = makeTarget(bw, bh);
}

const sub  =(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const norm =(a)=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];

let yaw=0.5, pitch=0.16, dist=15.0, autoSpin=true, dragging=false, lastX=0, lastY=0;
canvas.addEventListener("mousedown", e=>{dragging=true; autoSpin=false; lastX=e.clientX; lastY=e.clientY;});
window.addEventListener("mouseup", ()=>dragging=false);
window.addEventListener("mousemove", e=>{
  if(!dragging) return;
  yaw += (e.clientX-lastX)*0.006;
  pitch = Math.max(-1.35, Math.min(1.35, pitch + (e.clientY-lastY)*0.006));
  lastX=e.clientX; lastY=e.clientY;
});
canvas.addEventListener("wheel", e=>{
  dist = Math.max(7.0, Math.min(40.0, dist + Math.sign(e.deltaY)*0.8)); e.preventDefault();
}, {passive:false});

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 1.5);
  const w = Math.floor(window.innerWidth*dpr), h = Math.floor(window.innerHeight*dpr);
  if(canvas.width!==w || canvas.height!==h){
    canvas.width=w; canvas.height=h;
    canvas.style.width=window.innerWidth+"px"; canvas.style.height=window.innerHeight+"px";
  }
  if(w!==curW || h!==curH){ curW=w; curH=h; allocTargets(w,h); }
}
window.addEventListener("resize", resize);
function drawFull(){ gl.drawArrays(gl.TRIANGLES,0,3); }

function frame(ms){
  const t = ms*0.001;
  if(autoSpin) yaw = 0.4 + t*0.06;
  resize();

  const camPos = [
    Math.cos(pitch)*Math.cos(yaw)*dist,
    Math.sin(pitch)*dist,
    Math.cos(pitch)*Math.sin(yaw)*dist,
  ];
  const fwd   = norm(sub([0,0,0], camPos));
  const right = norm(cross(fwd,[0,1,0]));
  const up    = cross(right,fwd);

  // pass 1: Kerr scene -> HDR
  gl.bindFramebuffer(gl.FRAMEBUFFER, scene.fbo);
  gl.viewport(0,0,scene.w,scene.h);
  gl.useProgram(progScene);
  gl.uniform2f(Us.uRes, scene.w, scene.h);
  gl.uniform1f(Us.uTime, t);
  gl.uniform3fv(Us.uCamPos,camPos); gl.uniform3fv(Us.uCamRight,right);
  gl.uniform3fv(Us.uCamUp,up); gl.uniform3fv(Us.uCamFwd,fwd);
  gl.uniform1f(Us.uTanHalfFov, Math.tan(0.5*50.0*Math.PI/180.0));
  drawFull();

  // pass 2: bright extract + horizontal blur
  gl.useProgram(progBlur);
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomA.fbo);
  gl.viewport(0,0,bloomA.w,bloomA.h);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scene.tex);
  gl.uniform1i(Ub.uTex,0);
  gl.uniform2f(Ub.uResOut, bloomA.w, bloomA.h);
  gl.uniform2f(Ub.uTexelIn, 1/scene.w, 1/scene.h);
  gl.uniform2f(Ub.uDir, 1.0, 0.0); gl.uniform1f(Ub.uThresh, 1.0);
  drawFull();

  // pass 3: vertical blur
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomB.fbo);
  gl.viewport(0,0,bloomB.w,bloomB.h);
  gl.bindTexture(gl.TEXTURE_2D, bloomA.tex);
  gl.uniform2f(Ub.uResOut, bloomB.w, bloomB.h);
  gl.uniform2f(Ub.uTexelIn, 1/bloomA.w, 1/bloomA.h);
  gl.uniform2f(Ub.uDir, 0.0, 1.0); gl.uniform1f(Ub.uThresh, 0.0);
  drawFull();

  // pass 4: second blur iteration (wider glow)
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomA.fbo);
  gl.bindTexture(gl.TEXTURE_2D, bloomB.tex);
  gl.uniform2f(Ub.uTexelIn, 1/bloomB.w, 1/bloomB.h);
  gl.uniform2f(Ub.uResOut, bloomA.w, bloomA.h);
  gl.uniform2f(Ub.uDir, 1.0, 0.0);
  drawFull();
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomB.fbo);
  gl.bindTexture(gl.TEXTURE_2D, bloomA.tex);
  gl.uniform2f(Ub.uTexelIn, 1/bloomA.w, 1/bloomA.h);
  gl.uniform2f(Ub.uDir, 0.0, 1.0);
  drawFull();

  // pass 5: composite
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.useProgram(progComp);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scene.tex);  gl.uniform1i(Uc.uScene,0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomB.tex); gl.uniform1i(Uc.uBloom,1);
  gl.uniform2f(Uc.uResOut, canvas.width, canvas.height);
  drawFull();

  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
